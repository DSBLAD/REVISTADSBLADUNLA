  <body class="error">
    <div>
      <h3>404</h3>
      <h2>Página no encontrada</h2>
      <p>Puede que el enlace esté roto o la página haya sido movida.</p>
      <a href="#" id="home-link">Volver al inicio</a>

        const rootUrl = `${url.origin}/`;
        document.getElementById("home-link").href = rootUrl;
      </script>
    </div>
