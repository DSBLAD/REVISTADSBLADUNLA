    <!-- DESCOMENTAR ESTO CUANDO SE LANCE EL SITIO -->
    <!-- <link rel="stylesheet" href="style.css" /> -->

    <!-- BORRAR ESTO CUANDO SE LANCE EL SITIO -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        position: relative;
        background: radial-gradient(
          at top left,
          #fce3b0 0%,
          #ed6d20 35%,
          #7c139e 80%,
          #541863 96%
        );
        color: #fff;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
      }
      .container {
        border: 3px solid white;
        height: 600px;
        width: 600px !important;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      h1,
      #countdown,
      #btn-final {
        position: relative;
        z-index: 1;
      }

      h1 {
        font-family: "IBM Plex Mono", monospace;
        font-size: 2.5rem !important;
        margin-bottom: 1rem !important;
        font-weight: 600 !important;
      }

      #countdown {
        font-family: "Fira Sans", sans-serif;
        display: flex;
        gap: 1rem;
        font-size: 2rem;
        margin-bottom: 2rem;
      }

      .time-box {
        min-width: 100px;
        min-height: 100px;
        background: black;
        padding: 1rem;
      }

      .label {
        font-size: 0.9rem;
        margin-top: 0.5rem;
        display: block;
      }

      #btn-final {
        display: none;
        background-color: #5b3f92; /* violeta institucional */
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 30px;
        font-size: 1rem;
        cursor: pointer;
        transition: background 0.3s ease;
      }

      #btn-final:hover {
        background-color: #7a5eb2;
      }

      @media (max-width: 768px) {
        h1 {
          font-size: 1.8rem;
        }
        #countdown {
          font-size: 1.2rem;
          flex-wrap: wrap;
        }
        .time-box {
          min-width: 70px;
          min-height: 70px;
        }
        .container {
          border: none;
          height: unset;
          width: unset;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>
        Lanzamiento Revista<br />
        DSB LAD
      </h1>
      <div id="countdown">
        <div class="time-box">
          <span id="days">00</span>
          <span class="label">días</span>
        </div>
        <div class="time-box">
          <span id="hours">00</span>
          <span class="label">horas</span>
        </div>
        <div class="time-box">
          <span id="minutes">00</span>
          <span class="label">min</span>
        </div>
        <div class="time-box">
          <span id="seconds">00</span>
          <span class="label">seg</span>
        </div>
      </div>
      <div
        class="flex items-center gap-2 text-lg sm:text-xl font text-pastelviolet"
      >
        <!-- Logo UNLa -->
        <a
          href="https://www.unla.edu.ar/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="./images/logo-unla.png"
            alt="logo unla"
            class="h-10 w-auto object-contain"
          />
        </a>
        <!-- Logo depto -->
        <a
          href="https://www.unla.edu.ar/departamentos/humanidades-y-artes"
          target="_blank"
          rel="noopener noreferrer"
          class="ml-3"
        >
          <img
            src="./images/logo-depto.png"
            alt="logo unla"
            class="h-10 w-auto object-contain"
          />
        </a>
        <!-- Logo LAD -->
        <a
          href="https://lad.unla.edu.ar/"
          target="_blank"
          rel="noopener noreferrer"
          class="ml-3"
        >
          <img
            src="./images/logo-lad.png"
            alt="logo lad"
            class="h-10 w-auto object-contain"
          />
        </a>
      </div>
    </div>

    <script>
      const endDate = new Date("2025-10-23T15:00:00-03:00").getTime();
      const countdown = setInterval(() => {
        const now = new Date().getTime();
        const distance = endDate - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").textContent = String(days).padStart(
          2,
          "0"
        );
        document.getElementById("hours").textContent = String(hours).padStart(
          2,
          "0"
        );
        document.getElementById("minutes").textContent = String(
          minutes
        ).padStart(2, "0");
        document.getElementById("seconds").textContent = String(
          seconds
        ).padStart(2, "0");

        if (distance <= 0) {
          clearInterval(countdown);
          document.getElementById("countdown").style.display = "none";
          document.getElementById("btn-final").style.display = "inline-block";
        }
      }, 1000);
    </script>
  </body>
</html>
